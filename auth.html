    <header id="header" style="background-color: black; text-align: center;">
        <h3 style="color: white;">CONNEXION</h3>

   <main id="main" class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <section class="contact w-100" style="max-width: 500px;">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-5">
        <h3 class="text-center mb-4 fw-bold text-primary">
          <i class="fas fa-lock me-2"></i>Connexion Sécurisée
        </h3>

        <form action="dashboard.php" method="post" role="form" class="needs-validation" novalidate>
          <div class="row gy-4">
            
            <!-- Champ mot de passe -->
            <div class="col-12 form-floating">
              <input type="text" name="nom" class="form-control rounded-3" id="nama" placeholder="Mot de passe" required>
              <label for="nama"><i class="fas fa-key me-2 text-muted"></i> Mot de passe</label>
              <div class="invalid-feedback">Veuillez entrer votre mot de passe.</div>
            </div>

            <!-- Champ mot de passe 2 -->
            <div class="col-12 form-floating">
              <input type="email" name="email" class="form-control rounded-3" id="email" placeholder="Mot de passe 2" required>
              <label for="email"><i class="fas fa-lock me-2 text-muted"></i> Mot de passe 2</label>
              <div class="invalid-feedback">Veuillez entrer le second mot de passe.</div>
            </div>

            <!-- Bouton connexion -->
            <div class="col-12 text-center">
              <button type="submit" name="send" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm animate-btn">
                <i class="fas fa-sign-in-alt me-2"></i> CONNEXION
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>
